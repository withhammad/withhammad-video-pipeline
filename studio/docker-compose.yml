# WithHammad Studio. Joins the existing Caddy network on the VPS so studio.withhammad.com
# can be served by /opt/intake-relay's Caddy (see deploy/Caddyfile.snippet).
name: withhammad-studio
services:
  api:
    build: .
    container_name: studio-api
    restart: unless-stopped
    env_file: .env
    volumes: [ "data:/data" ]
    ports: [ "127.0.0.1:8080:8000" ]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [ default, edge ]
  worker:
    build: .
    container_name: studio-worker
    restart: unless-stopped
    env_file: .env
    volumes: [ "data:/data" ]
    command: ["python", "-m", "app.worker"]
    mem_limit: 512m
    depends_on: [ api ]
volumes:
  data: {}
networks:
  edge:
    external: true
    name: intake-relay_default
