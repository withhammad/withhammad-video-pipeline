<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>02 Gradient → flow</title>
<link rel="stylesheet" href="../../tokens.css"><script src="../../motion.js"></script>
<style>
  .label { position: absolute; left: 34px; top: 30px; font-size: 22px; font-weight: 600; color: var(--ink); }
</style></head>
<body class="light"><div class="stage"><div class="label">Flow</div></div>
<script>
// Scene line: "Gradient -> flow: the loud gradient under a slanted edge, its colour bands drifting like liquid."
const { canvas, run } = Motion;
const stage = document.querySelector('.stage');
const { ctx } = canvas(stage);
stage.appendChild(stage.querySelector('.label'));
const TAU = Math.PI * 2;
// blobs: colour, centre, drift radius, speed in whole cycles per loop (so the loop has no seam), phase
const BLOBS = [
  ['#ffd601', 120, 420, 120, 1, 0], ['#ff6118', 300, 380, 140, 1, 2.1], ['#f44bcc', 470, 300, 150, 1, 4.0],
  ['#ee30fb', 220, 300, 130, 2, 1.0], ['#7232f1', 520, 470, 120, 1, 3.3], ['#533afd', 60, 520, 140, 2, 5.2],
  ['#ff6118', 560, 200, 110, 1, .7], ['#ffcf5e', 380, 520, 120, 2, 2.6],
];
run((t) => {
  ctx.clearRect(0, 0, 560, 500);
  ctx.save();
  ctx.beginPath();  // Stripe's slanted section edge
  ctx.moveTo(0, 210); ctx.lineTo(560, 64); ctx.lineTo(560, 500); ctx.lineTo(0, 500); ctx.closePath();
  ctx.clip();
  ctx.fillStyle = '#f44bcc'; ctx.fillRect(0, 0, 560, 500);
  ctx.filter = 'blur(46px)';
  for (const [c, x, y, r, sp, ph] of BLOBS) {
    const a = TAU * sp * t / 6 + ph;
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.ellipse(x + Math.cos(a) * r * .55, y + Math.sin(a * 1) * r * .35, r * 1.25, r * .7, Math.sin(a) * .5, 0, TAU);
    ctx.fill();
  }
  ctx.filter = 'none';
  // a soft sheen band that sweeps once per loop
  const sx = -200 + 960 * ((t / 6) % 1);
  const sheen = ctx.createLinearGradient(sx - 120, 0, sx + 120, 0);
  sheen.addColorStop(0, 'rgba(255,255,255,0)'); sheen.addColorStop(.5, 'rgba(255,255,255,.18)'); sheen.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sheen; ctx.fillRect(0, 0, 560, 500);
  ctx.restore();
});
</script></body></html>
