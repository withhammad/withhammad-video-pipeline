<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>10 Ribbon → twist</title>
<link rel="stylesheet" href="../../tokens.css"><script src="../../motion.js"></script></head>
<body class="dark"><div class="stage"></div>
<script>
// Scene line: "Ribbon -> twist: a ribbon of 70 hairlines twists through itself, orange on the left to violet on the right."
const { canvas, run, loud } = Motion;
const { ctx } = canvas(document.querySelector('.stage'));
const LINES = 70, TAU = Math.PI * 2;
run((t) => {
  ctx.clearRect(0, 0, 560, 500);
  const a = TAU * t / 6;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = .9;
  for (let i = 0; i < LINES; i++) {
    const s = i / (LINES - 1) - .5;
    ctx.beginPath();
    for (let x = -20; x <= 580; x += 6) {
      const u = x / 560;
      const centre = 250 + 70 * Math.sin(u * 5.2 - a) + 18 * Math.sin(u * 11 + 2 * a);
      const twist = u * 7.5 - a * 2;                          // angle of the ribbon's cross-section
      const width = 64 + 26 * Math.sin(u * 3 + a);
      const y = centre + s * width * Math.cos(twist) * 2;
      x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    const g = ctx.createLinearGradient(0, 0, 560, 0);
    g.addColorStop(0, loud(.2)); g.addColorStop(.5, loud(.55)); g.addColorStop(1, loud(.85));
    ctx.strokeStyle = g;
    ctx.globalAlpha = .3 + .45 * (1 - Math.abs(s) * 1.6);
    ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
});
</script></body></html>
