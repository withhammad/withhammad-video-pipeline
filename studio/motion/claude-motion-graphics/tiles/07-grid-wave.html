<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>07 Grid → wave</title>
<link rel="stylesheet" href="../../tokens.css"><script src="../../motion.js"></script></head>
<body class="light"><div class="stage"></div>
<script>
// Scene line: "Grid -> wave: a field of dots in perspective rolls like a sheet of silk."
const { canvas, run, loud } = Motion;
const { ctx } = canvas(document.querySelector('.stage'));
const COLS = 34, ROWS = 22, TAU = Math.PI * 2;
run((t) => {
  ctx.clearRect(0, 0, 560, 500);
  const a = TAU * t / 6;
  const dots = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const u = c / (COLS - 1) - .5, v = r / (ROWS - 1);       // u across, v from far (0) to near (1)
    const h = 34 * Math.sin(u * 7 + a) * Math.cos(v * 4 - a) + 22 * Math.sin(v * 5 + u * 3 + 2 * a);
    const depth = .45 + .75 * v;                              // simple perspective
    const x = 280 + u * 640 * depth, y = 120 + v * 300 - h * depth;
    dots.push([x, y, depth, c / (COLS - 1), h]);
  }
  for (const [x, y, d, k, h] of dots) {
    if (x < -10 || x > 570) continue;
    ctx.globalAlpha = .35 + .55 * d;
    ctx.fillStyle = loud(.2 + .7 * (1 - k) * .6 + (h + 56) / 112 * .3);
    ctx.beginPath(); ctx.arc(x, y, 1.1 + 2.1 * d, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
});
</script></body></html>
