<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>13 Rings → orbit</title>
<link rel="stylesheet" href="../../tokens.css"><script src="../../motion.js"></script></head>
<body class="dark"><div class="stage"></div>
<script>
// Scene line: "Rings -> orbit: a glowing planet with tilted rings; three moons orbit at different speeds, passing behind it."
const { canvas, run } = Motion;
const { ctx } = canvas(document.querySelector('.stage'));
const CX = 280, CY = 250, TAU = Math.PI * 2;
// ring: radius x, radius y, tilt; moon: ring index, laps per loop (whole numbers keep the loop seamless), phase, colour, size
const RINGS = [[200, 58, -.2], [150, 44, -.2], [108, 32, -.2]];
const MOONS = [[0, 1, .3, '#ff6118', 9], [1, 2, 2.2, '#7f7dfc', 7.5], [2, 3, 4.1, '#ee30fb', 6], [0, 1, 3.4, '#ffd601', 4.5]];
const pos = (ring, a) => {
  const [rx, ry, tilt] = RINGS[ring];
  const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
  return [CX + x * Math.cos(tilt) - y * Math.sin(tilt), CY + x * Math.sin(tilt) + y * Math.cos(tilt), Math.sin(a)];
};
const ring = (i, back) => {
  const [rx, ry, tilt] = RINGS[i];
  ctx.strokeStyle = `rgba(200,190,255,${back ? .16 : .38})`; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.ellipse(CX, CY, rx, ry, tilt, back ? Math.PI : 0, back ? TAU : Math.PI); ctx.stroke();
};
const moon = ([r, laps, ph, c, s], t) => {
  const [x, y] = pos(r, TAU * laps * t / 6 + ph);
  const g = ctx.createRadialGradient(x, y, 0, x, y, s * 3);
  g.addColorStop(0, c); g.addColorStop(.35, c); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.globalAlpha = .35; ctx.beginPath(); ctx.arc(x, y, s * 3, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, s, 0, TAU); ctx.fill();
};
run((t) => {
  ctx.clearRect(0, 0, 560, 500);
  const glow = ctx.createRadialGradient(CX, CY, 20, CX, CY, 190);
  glow.addColorStop(0, 'rgba(238,48,251,.35)'); glow.addColorStop(1, 'rgba(83,58,253,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, 560, 500);
  RINGS.forEach((_, i) => ring(i, true));
  MOONS.filter((m) => pos(m[0], TAU * m[1] * t / 6 + m[2])[2] < 0).forEach((m) => moon(m, t));  // behind the planet
  const p = ctx.createRadialGradient(CX - 22, CY - 26, 6, CX, CY, 64);
  p.addColorStop(0, '#ffd2ff'); p.addColorStop(.35, '#ee30fb'); p.addColorStop(.75, '#7232f1'); p.addColorStop(1, '#3c1a9e');
  ctx.fillStyle = p; ctx.beginPath(); ctx.arc(CX, CY, 58, 0, TAU); ctx.fill();
  RINGS.forEach((_, i) => ring(i, false));
  MOONS.filter((m) => pos(m[0], TAU * m[1] * t / 6 + m[2])[2] >= 0).forEach((m) => moon(m, t));  // in front
});
</script></body></html>
