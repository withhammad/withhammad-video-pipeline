<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Inter;src:url(assets/inter-latin-700-normal.woff2);font-weight:700}@font-face{font-family:Inter;src:url(assets/inter-latin-400-normal.woff2);font-weight:400}*{box-sizing:border-box}body{margin:0;width:1080px;height:1120px;overflow:hidden;background:#f4efd8;font-family:Inter;color:#2b241c}#scene{position:absolute;top:40px;left:0;width:1080px;height:1080px;background-image:url(assets/hype-strip.png);background-size:3240px 1080px}#model{position:absolute;left:448px;top:580px;width:190px;text-align:center;font-size:40px;font-weight:700;color:#312c23}#headline{position:absolute;top:35px;left:55px;right:55px;font-size:48px;text-align:center;font-weight:700;background:#f4efd8e8;padding:15px}#foot{position:absolute;bottom:25px;left:40px;right:40px;display:flex;justify-content:space-between;font-size:21px;font-weight:700;background:#f4efd8e8;padding:12px}</style></head><body><div id="scene"></div><div id="model">GPT</div><div id="headline">The new-model hype cycle</div><div id="foot"><span>WITHHAMMAD</span><span>Test the model on your actual work.</span></div><script>window.__seek=(t)=>{const p=t%15.5,phase=Math.floor(p/5.1667),local=p%5.1667;const pose=local<1.9?0:local<3.45?1:2;document.querySelector('#scene').style.backgroundPosition=(-pose*1080)+'px 0';document.querySelector('#model').textContent=['GPT','Gemini','Claude'][phase%3];document.querySelector('#headline').textContent=local<1.9?'This changes everything!':local<3.45?'The best model. Ever.':'Wait… another model just dropped.';document.querySelector('#model').style.transform='scale('+(1+.025*Math.sin(local*3))+')';};window.__seek(0);</script></body></html>
