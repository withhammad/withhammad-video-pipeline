<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>27 Claude installs for LinkedIn</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  /* Reference layout (charlie-hills LinkedIn GIF, 1080x1350, 10 s loop): title, byline, root folder, a trunk down the
     left, five coloured folders, each with a row of MD files and a badge. Draw is a function of t alone (__seek). */
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; transform-origin: 0 0; background: #fff;
    font-family: 'Inter', system-ui, sans-serif; color: #111; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(#eef0f3 1px, transparent 1px), linear-gradient(90deg, #eef0f3 1px, transparent 1px);
    background-size: 40px 40px; opacity: .55; }
  .spark { position: absolute; right: -70px; top: -70px; width: 330px; height: 330px; opacity: .9; }
  h1 { position: absolute; left: 0; right: 0; top: 30px; margin: 0; text-align: center; font-weight: 800;
    letter-spacing: -0.045em; line-height: 72px; font-size: 70px; }
  h1 .accent { color: #0a72e8; }
  .sub { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; align-items: center;
    gap: 16px; font-size: 19.5px; color: #6b7280; letter-spacing: -0.01em; }
  .sub b { color: #111; font-weight: 600; }
  .sub .bar { width: 1px; height: 26px; background: #d6d9de; }
  .sub .who { display: flex; align-items: center; gap: 10px; color: #111; font-weight: 600; }
  .sub img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
  .root { position: absolute; left: 470px; top: 280px; width: 140px; height: 112px; }
  .rootlab { position: absolute; left: 0; right: 0; top: 400px; text-align: center; }
  .rootlab b { display: block; font-size: 23px; letter-spacing: -0.02em; }
  .rootlab span { font-size: 15px; color: #6b7280; }
  svg.lines { position: absolute; left: 0; top: 0; }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; pointer-events: none; }
  .folder { position: absolute; width: 90px; height: 72px; }
  .flab { position: absolute; width: 110px; text-align: center; }
  .flab b { font-size: 18.5px; letter-spacing: -0.02em; }
  .flab b::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--c); margin-right: 7px; vertical-align: 2px; }
  .flab span { display: block; font-size: 12.5px; color: #6b7280; line-height: 15px; margin-top: 1px; }
  .file { position: absolute; width: 140px; }
  .doc { position: absolute; left: 47px; top: 0; width: 42px; height: 52px; }
  .badge { position: absolute; left: 88px; top: 39px; height: 22px; padding: 0 8px; border-radius: 11px; display: flex;
    align-items: center; gap: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge.official { background: #0a72e8; color: #fff; }
  .badge.builtin { background: #1f9d48; color: #fff; }
  .badge.star { background: #fff; color: #111; box-shadow: 0 0 0 1px #e1e4e8; }
  .badge.star i { color: #f5a300; font-style: normal; font-size: 12px; }
  .meta { position: absolute; left: 0; right: 0; top: 66px; }
  .name { text-align: center; line-height: 16px; font-family: 'JetBrains Mono', monospace;
    font-weight: 500; font-size: 12.5px; letter-spacing: -0.02em; color: #111; }
  .desc { margin: 2px 6px 0; text-align: center; font-size: 12.5px; line-height: 16px;
    color: #4b5563; }
  .foot { position: absolute; left: 0; right: 0; top: 1306px; text-align: center; font-size: 17.5px; font-weight: 600;
    letter-spacing: -0.01em; }
  .foot a { color: #0a72e8; text-decoration: none; margin-left: 6px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="grid"></div>
  <svg class="spark" viewBox="-100 -100 200 200" id="spark"></svg>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <svg class="root" viewBox="0 0 140 112" id="root"></svg>
  <div class="rootlab" id="rootlab"></div>
  <svg class="lines" width="1080" height="1350" id="lines"></svg>
  <canvas id="fx"></canvas>
  <div id="rows"></div>
  <div class="foot" id="foot"></div>
</div>
<script src="data.js"></script>
<script>
(function () {
  const D = window.POSTER, T = 10;
  const ROW0 = 523, PITCH = 156.25, X0 = 254, DX = 140, TRUNK = 42, ROOT_Y = 452, BUS_Y = 470;
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
  // a quick rise then a slow fall: the glow a pulse leaves on a folder or a file
  const flash = (t, at, up = .12, down = 1.1) => t < at ? 0 : t < at + up ? easeOut((t - at) / up) : Math.pow(1 - seg(t, at + up, at + up + down), 2);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

  // header
  document.getElementById('title').innerHTML = `${esc(D.title[0])}<br>${esc(D.title[1])}<span class="accent">${esc(D.titleAccent)}</span>`;
  document.getElementById('sub').innerHTML = `<span>${esc(D.sub[0])}<b>${esc(D.sub[1])}</b></span><span class="bar"></span>
    <span class="who"><img src="assets/hammad.jpg" alt="">${esc(D.byline)}</span>`;
  document.getElementById('rootlab').innerHTML = `<b>${esc(D.root[0])}</b><span>${esc(D.root[1])}</span>`;
  document.getElementById('foot').innerHTML = `${esc(D.footer[0])}<a>${esc(D.footer[1])}</a>`;

  // the faint starburst in the corner, as in the reference
  let rays = '';
  for (let i = 0; i < 12; i++) {
    const a = i * 30 + (i % 2 ? 9 : 0), len = i % 3 === 0 ? 96 : i % 3 === 1 ? 80 : 88;
    rays += `<rect x="-7" y="${-len}" width="14" height="${len - 14}" rx="7" transform="rotate(${a})" fill="#e7e9ec"/>`;
  }
  document.getElementById('spark').innerHTML = rays;

  // LinkedIn mark (simple-icons path, CC0) on a folder
  const IN = 'M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z';
  const folderSvg = (w, h, c1, c2, id) => `
    <defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <path d="M${w * .02} ${h * .14} q0 -${h * .1} ${w * .07} -${h * .1} h${w * .3} q${w * .05} 0 ${w * .08} ${h * .06} l${w * .03} ${h * .05} h${w * .43} q${w * .05} 0 ${w * .05} ${h * .07} v${h * .72} h-${w * .96} z" fill="${c2}" opacity=".8"/>
    <rect x="0" y="${h * .2}" width="${w}" height="${h * .8}" rx="${w * .05}" fill="url(#g${id})"/>`;
  document.getElementById('root').innerHTML = folderSvg(140, 112, '#9fdcff', '#55b7f5', 'r') +
    `<rect x="44" y="34" width="52" height="52" rx="10" fill="#fff"/><g transform="translate(44 34) scale(2.1667)"><path d="${IN}" fill="#0a66c2"/></g>`;

  // static lines: root -> bus -> trunk -> each folder, and each row's line
  const rowY = (i) => ROW0 + i * PITCH;
  let ls = `<path d="M540 ${ROOT_Y} V${BUS_Y - 10} q0 10 -10 10 H${TRUNK + 10} q-10 0 -10 10 V${rowY(4) + 35}" fill="none" stroke="#9aa1ab" stroke-width="2"/>`;
  ls += `<circle cx="540" cy="${ROOT_Y}" r="4" fill="#fff" stroke="#9aa1ab" stroke-width="2"/>`;
  D.folders.forEach((f, i) => {
    const y = rowY(i) + 35, ly = rowY(i) + 28, end = X0 + DX * (f.items.length - 1) + 30;
    ls += `<path d="M${TRUNK} ${y} H70" stroke="#9aa1ab" stroke-width="2"/><path d="M66 ${y - 5} l7 5 -7 5 z" fill="#9aa1ab"/>`;
    ls += `<path d="M175 ${ly} H${end}" stroke="${f.line}" stroke-width="2.4"/>`;
    ls += `<path d="M175 ${ly + 5} v-5" stroke="${f.line}" stroke-width="2.4"/><circle cx="175" cy="${ly + 6}" r="3.5" fill="#fff" stroke="${f.line}" stroke-width="2"/>`;
    f.items.forEach((_, j) => { ls += `<circle cx="${X0 + DX * j - 36}" cy="${ly}" r="3.2" fill="${f.line}"/>`; });
  });
  document.getElementById('lines').innerHTML = ls;

  // folders and files
  const rows = document.getElementById('rows'), F = [];
  const docSvg = `<svg viewBox="0 0 42 52" width="42" height="52"><path d="M3 1h25l13 13v35a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2z" fill="#fff" stroke="#d5d9df" stroke-width="1.5"/>
    <path d="M28 1v11a2 2 0 0 0 2 2h11" fill="#f1f3f5" stroke="#d5d9df" stroke-width="1.5"/>
    <text x="6" y="44" font-family="Inter" font-weight="700" font-size="10" fill="#8a919b">MD</text></svg>`;
  D.folders.forEach((f, i) => {
    const top = rowY(i);
    const fo = el('div', 'folder'); fo.style.left = '80px'; fo.style.top = top + 'px';
    fo.innerHTML = `<svg viewBox="0 0 90 72" width="90" height="72" style="overflow:visible">${folderSvg(90, 72, f.fill[0], f.fill[1], i)}</svg>`;
    rows.appendChild(fo);
    const lab = el('div', 'flab', `<b>${esc(f.name)}</b><span>${esc(f.sub)}</span>`);
    lab.style.left = '70px'; lab.style.top = (top + 79) + 'px'; lab.style.setProperty('--c', f.line);
    rows.appendChild(lab);
    const files = f.items.map(([name, kind, stars, desc], j) => {
      const fi = el('div', 'file'); fi.style.left = (X0 + DX * j - 70) + 'px'; fi.style.top = top + 'px';
      const badge = kind === 'star' ? `<i>&#9733;</i>${esc(stars)}` : kind === 'official' ? 'official' : 'built-in';
      fi.innerHTML = `<div class="doc">${docSvg}</div><div class="badge ${kind}">${badge}</div>
        <div class="meta"><div class="name">${esc(name).replace(/-/g, '-<wbr>')}</div><div class="desc">${esc(desc)}</div></div>`;
      fi.querySelector('.doc').style.left = '49px'; fi.querySelector('.badge').style.left = '88px';
      rows.appendChild(fi);
      return { doc: fi.querySelector('.doc'), badge: fi.querySelector('.badge'), x: X0 + DX * j };
    });
    F.push({ fo, files, color: f.line, top });
  });

  // timeline: five pulses leave the root together-ish, run the bus and trunk, light their folder, then sweep the row
  const SPEED = 600, ROW_SPEED = 380;
  const pathPts = (i) => [[540, ROOT_Y], [540, BUS_Y], [TRUNK, BUS_Y], [TRUNK, rowY(i) + 35], [80, rowY(i) + 35]];
  const P = D.folders.map((f, i) => {
    const pts = pathPts(i); let len = 0; const cum = [0];
    for (let k = 1; k < pts.length; k++) { len += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]); cum.push(len); }
    const start = 0.35 + i * 0.4, arrive = start + len / SPEED;
    const rowStart = arrive + 0.25, rowEnd = rowStart + (DX * (f.items.length - 1) + 110) / ROW_SPEED;
    return { pts, cum, len, start, arrive, rowStart, rowEnd };
  });
  const at = (p, d) => { d = clamp(d, 0, p.len); let k = 1; while (k < p.cum.length - 1 && p.cum[k] < d) k++;
    const a = p.pts[k - 1], b = p.pts[k], s = (d - p.cum[k - 1]) / ((p.cum[k] - p.cum[k - 1]) || 1);
    return [a[0] + (b[0] - a[0]) * s, a[1] + (b[1] - a[1]) * s]; };

  const cv = document.getElementById('fx'); let ctx, k = 1;
  const size = () => { k = (window.devicePixelRatio || 1) * scale; cv.width = 1080 * k; cv.height = 1350 * k; ctx = cv.getContext('2d'); };
  const rgba = (h, a) => `rgba(${parseInt(h.slice(1, 3), 16)},${parseInt(h.slice(3, 5), 16)},${parseInt(h.slice(5, 7), 16)},${a})`;
  function comet(points, color, alpha) {
    if (alpha <= 0 || points.length < 2) return;
    for (let n = 1; n < points.length; n++) {
      const f = n / points.length;
      ctx.strokeStyle = rgba(color, alpha * f * .9); ctx.lineWidth = 2.5 + 3 * f; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(points[n - 1][0], points[n - 1][1]); ctx.lineTo(points[n][0], points[n][1]); ctx.stroke();
    }
    const [x, y] = points[points.length - 1];
    const g = ctx.createRadialGradient(x, y, 0, x, y, 22);
    g.addColorStop(0, rgba(color, .55 * alpha)); g.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 22, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 4.2, 0, 7); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.arc(x, y, 5.4, 0, 7); ctx.stroke();
  }

  function draw(t) {
    ctx.setTransform(k, 0, 0, k, 0, 0); ctx.clearRect(0, 0, 1080, 1350);
    D.folders.forEach((f, i) => {
      const p = P[i], R = F[i];
      // trunk pulse
      if (t > p.start && t < p.arrive + .2) {
        const d = (t - p.start) * SPEED, pts = [];
        for (let s = Math.max(0, d - 110); s <= Math.min(d, p.len); s += 6) pts.push(at(p, s));
        pts.push(at(p, Math.min(d, p.len)));
        comet(pts, f.line, 1 - seg(t, p.arrive, p.arrive + .2));
      }
      // folder glow
      const fg = flash(t, p.arrive, .14, 1.4);
      R.fo.style.transform = `scale(${1 + .07 * fg})`;
      R.fo.style.filter = fg > .01 ? `drop-shadow(0 0 ${18 * fg}px ${rgba(f.line, .75 * fg)})` : 'none';
      // row sweep
      const ly = R.top + 28, x0 = 175, x1 = X0 + DX * (f.items.length - 1) + 30;
      if (t > p.rowStart && t < p.rowEnd + .3) {
        const x = Math.min(x1, x0 + (t - p.rowStart) * ROW_SPEED), a = 1 - seg(t, p.rowEnd, p.rowEnd + .3), pts = [];
        for (let s = Math.max(x0, x - 140); s <= x; s += 6) pts.push([s, ly]);
        pts.push([x, ly]);
        comet(pts, f.line, a);
      }
      R.files.forEach((fl) => {
        const hit = p.rowStart + (fl.x - 30 - x0) / ROW_SPEED, g = flash(t, hit, .12, 1.3);
        fl.doc.style.transform = `translateY(${-5 * g}px)`;
        fl.doc.style.filter = g > .01 ? `drop-shadow(0 4px ${12 * g}px ${rgba(f.line, .7 * g)})` : 'none';
        fl.badge.style.boxShadow = (fl.badge.classList.contains('star') ? '0 0 0 1px #e1e4e8, ' : '') +
          `0 0 0 ${2.5 * g}px ${rgba(f.line, .9 * g)}, 0 0 ${16 * g}px ${rgba(f.line, .55 * g)}`;
      });
    });
  }

  // fit the 1080x1350 design into the window; capture.mjs sets the window to the design size
  const stage = document.getElementById('stage'); let scale = 1;
  const fit = () => { scale = Math.min(innerWidth / 1080, innerHeight / 1350);
    stage.style.transform = `translate(${(innerWidth - 1080 * scale) / 2}px, ${(innerHeight - 1350 * scale) / 2}px) scale(${scale})`; size(); };
  fit();
  let seeking = false, last = 0;
  const frame = (t) => { last = ((t % T) + T) % T; draw(last); };
  addEventListener('resize', () => { fit(); draw(last); });
  window.__seek = (t) => { seeking = true; frame(t); };
  window.__ready = Promise.all([document.fonts.ready, ...[...document.images].map((im) => im.decode().catch(() => {}))]);
  const tick = (now) => { if (seeking) return; frame(now / 1000); requestAnimationFrame(tick); };
  window.__ready.then(() => requestAnimationFrame(tick));
})();
</script>
</body>
</html>
