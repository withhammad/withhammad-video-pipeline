<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>08 0 → 12,480</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../apple.css"><script src="../../motion.js"></script>
<style>
  .widget { left: 28px; top: 72px; width: 504px; height: 356px; border-radius: 40px; }
  .head { position: absolute; left: 34px; top: 30px; display: flex; align-items: center; gap: 14px; }
  .head .squircle { position: relative; width: 50px; height: 50px; --c1: #5AB8FF; --c2: #0A6FE6; display: grid; place-items: center; }
  .head b { font-size: 25px; font-weight: 600; color: var(--a-ink-2); letter-spacing: -.015em; }
  .live { position: absolute; right: 36px; top: 49px; width: 14px; height: 14px; border-radius: 50%; background: #30D158; }
  .live i { position: absolute; inset: 0; border-radius: 50%; background: #30D158; }
  .row { position: absolute; left: 30px; top: 104px; height: 166px; display: flex; align-items: center; font-size: 136px; font-weight: 800;
    letter-spacing: -.045em; font-variant-numeric: tabular-nums; line-height: 1; }
  .slot { position: relative; height: 166px; overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 22%, #000 78%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0%, #000 22%, #000 78%, transparent 100%); }
  .strip { position: absolute; left: 0; top: 0; width: 100%; }
  .strip span { display: block; height: 166px; line-height: 166px; text-align: center; }
  .comma { width: .3em; text-align: left; line-height: 166px; height: 166px; margin-right: -.02em; }
  .badge { position: absolute; left: 34px; bottom: 34px; height: 50px; padding: 0 20px 0 10px; border-radius: 25px; display: flex; align-items: center; gap: 10px;
    background: rgba(48,209,88,.13); color: #1FA347; font-size: 22px; font-weight: 700; letter-spacing: -.01em; transform-origin: 24px 25px; }
  .badge .up { width: 32px; height: 32px; border-radius: 50%; background: #30D158; display: grid; place-items: center; box-shadow: 0 3px 8px -2px rgba(31,174,69,.6); }
</style></head>
<body class="apple"><div class="stage">
  <div class="tint" style="--c:#0A84FF; left: -80px; top: -120px; opacity: .2"></div>
  <div class="tint" style="--c:#30D158; left: 300px; top: 280px; opacity: .14"></div>
  <div class="glass widget">
    <div class="head"><div class="squircle"><svg width="32" height="32" viewBox="0 0 24 24" style="position:relative;z-index:1">
      <circle cx="9" cy="8.2" r="3.4" fill="#fff"/><path d="M2.8 19.2c.4-3.6 3-5.6 6.2-5.6s5.8 2 6.2 5.6z" fill="#fff"/>
      <circle cx="16.6" cy="9" r="2.7" fill="rgba(255,255,255,.75)"/><path d="M15.4 13.9c.4-.1.8-.1 1.2-.1 2.6 0 4.6 1.6 4.9 4.6h-4.2c-.2-1.8-.8-3.3-1.9-4.5z" fill="rgba(255,255,255,.75)"/></svg></div>
      <b>Subscribers</b></div>
    <div class="live"><i></i></div>
    <div class="row" id="row"></div>
    <div class="badge"><span class="up"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 19V6M6 11.5L12 5.5l6 6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>+18% this month</div>
  </div>
</div>
<script>
// Scene line: a "Subscribers" widget: every digit rolls on its own like a mechanical counter from 0 to 12,480, blurred
// while fast, then "+18% this month" springs in. Every value is a function of t alone (6 s loop).
const { ease, seg, run, lerp, clamp, mix } = Motion;
const row = document.getElementById('row'), badge = document.querySelector('.badge'), live = document.querySelector('.live i');
const TARGET = [1, 2, 4, 8, 0], REVS = [0, 1, 1, 2, 2];
const START = [.55, .5, .45, .4, .35], END = [1.75, 2.0, 2.25, 2.5, 2.75];
const STEP = 166, INK = '#1d1d1f', GHOST = '#D4D6DC';
const slots = [], strips = [], GHOSTS = 9, A = 1 - Math.pow(.05, 1 / GHOSTS);
let comma;
TARGET.forEach((d, i) => {
  if (i === 2) { comma = document.createElement('div'); comma.className = 'comma'; comma.textContent = ','; row.appendChild(comma); }
  const s = document.createElement('div'); s.className = 'slot';
  // motion blur = several copies of the digit wheel spread along the motion (a big CSS/SVG blur renders blocky)
  const g = [];
  for (let j = 0; j < GHOSTS; j++) { const st = document.createElement('div'); st.className = 'strip';
    st.innerHTML = '0123456789012'.split('').map((c) => `<span>${c}</span>`).join(''); s.appendChild(st); g.push(st); }
  row.appendChild(s); slots.push(s); strips.push(g);
});
// fixed tabular width per digit slot
const probe = document.createElement('span'); probe.textContent = '0'; row.appendChild(probe);
const DW = probe.getBoundingClientRect().width; probe.remove();
slots.forEach((s) => (s.style.width = `${DW}px`));

// digit travel (in digits) of slot i at time t: spin up, coast, land with a small mechanical settle, then on the reset
// roll forward to the next 0 so the loop closes on 00,000
function travel(i, t) {
  const d = TARGET[i] + 10 * REVS[i];
  let v = d * ease.inOut(seg(t, START[i], END[i]));
  const x = seg(t, END[i], END[i] + .7);
  if (x > 0 && x < 1) v += .16 * Math.exp(-5 * x) * Math.sin(2 * Math.PI * 1.4 * x);
  const r0 = 4.85 + i * .07;
  const fwd = (10 - TARGET[i]) % 10 + (i === 4 ? 10 : 0);
  v += fwd * ease.inOut(seg(t, r0, r0 + .75));
  return v;
}
run((t) => {
  const grey = 1 - ease.inOut(seg(t, 4.9, 5.5)); // everything fades back to the ghost zeros on the reset
  TARGET.forEach((_, i) => {
    const v = travel(i, t);
    const m = ((v % 10) + 10) % 10;
    const speed = Math.abs(travel(i, t + .01) - travel(i, t - .01)) / .02 * STEP; // px per second
    const smear = Math.min(64, speed / 70), k = clamp(smear / 14);
    // leading zeros wait in a pale grey and ink in as their wheel starts; the ones wheel is always ink
    const on = i === 4 ? 1 : seg(t, START[i] - .05, START[i] + .3) * grey;
    const col = mix(GHOST, INK, on), mid = (GHOSTS - 1) / 2;
    strips[i].forEach((st, j) => {
      const off = (j - mid) / (GHOSTS - 1) * smear;
      st.style.transform = `translateY(${-m * STEP + off}px)`;
      st.style.opacity = j === mid ? lerp(1, A, k) : A * k;
      st.style.filter = smear > 3 ? `blur(${Math.min(3, smear / 20).toFixed(2)}px)` : '';
      st.style.color = col;
    });
  });
  comma.style.color = mix(GHOST, INK, seg(t, START[1] - .05, START[1] + .3) * grey);
  // the number lands, then the badge springs in from its arrow
  const bin = ease.spring(seg(t, 2.95, 3.65), 1), bout = ease.inOut(seg(t, 4.75, 5.15));
  const k = bin * (1 - bout);
  badge.style.opacity = clamp(seg(t, 2.95, 3.1)) * (1 - bout);
  badge.style.transform = `translateY(${(1 - k) * 14}px) scale(${lerp(.6, 1, k)})`;
  badge.style.filter = bout > 0 && bout < 1 ? `blur(${6 * bout}px)` : '';
  // the live dot breathes twice per loop
  const p = (t / 3) % 1;
  live.style.transform = `scale(${1 + 1.4 * p})`; live.style.opacity = .5 * (1 - p);
});
</script></body></html>
