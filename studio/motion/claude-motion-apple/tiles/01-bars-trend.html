<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>01 Bars → trend</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../apple.css"><script src="../../motion.js"></script>
<style>
  .card { left: 36px; top: 34px; width: 488px; height: 432px; border-radius: 38px; }
  .head { position: absolute; left: 66px; top: 64px; display: flex; align-items: center; gap: 12px; }
  .head .squircle { position: relative; width: 36px; height: 36px; display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding-bottom: 8px; }
  .head .squircle i { position: relative; z-index: 1; width: 5px; border-radius: 3px; background: #fff; }
  .head span { font-size: 22px; font-weight: 600; letter-spacing: -.015em; color: var(--a-ink); }
  .hero { position: absolute; left: 62px; top: 104px; font-size: 104px; line-height: 1; font-weight: 800; letter-spacing: -.05em;
    background: linear-gradient(180deg, #4ADE72 0%, #30D158 50%, #1FAE45 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    transform-origin: 0 60%; white-space: nowrap; filter: drop-shadow(0 10px 18px rgba(48,209,88,.28)); }
  .grid { position: absolute; left: 66px; width: 428px; height: 1px; background: rgba(0,0,0,.055); }
  .bar { position: absolute; bottom: 70px; width: 46px; border-radius: 17px; overflow: hidden;
    background: linear-gradient(180deg, #5AAEFF 0%, #2A90FF 45%, #0A6EF0 100%);
    box-shadow: 0 14px 22px -12px rgba(10,110,240,.7), 0 3px 6px -2px rgba(0,60,160,.25), inset 0 -3px 6px rgba(0,40,130,.25), inset 0 1px 0 rgba(255,255,255,.6); }
  .bar::after { content: ''; position: absolute; left: 6px; top: 5px; bottom: 8px; width: 9px; border-radius: 6px;
    background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.08)); }
  svg.line { position: absolute; left: 0; top: 0; width: 560px; height: 500px; overflow: visible; }
</style></head>
<body class="apple"><div class="stage">
  <div class="tint" style="--c:#30D158; left: 300px; top: -110px; opacity: .2"></div>
  <div class="tint" style="--c:#0A84FF; left: -120px; top: 230px"></div>
  <div class="glass card"></div>
  <div class="head"><div class="squircle" style="--c1:#4DA8FF;--c2:#0A6EF0"><i style="height:9px"></i><i style="height:15px"></i><i style="height:12px"></i></div><span>Weekly sign-ups</span></div>
  <div class="grid" style="top: 236px"></div><div class="grid" style="top: 316px"></div><div class="grid" style="top: 396px"></div>
  <div class="hero">+200%</div>
  <div id="bars"></div>
  <svg class="line" viewBox="0 0 560 500">
    <defs>
      <linearGradient id="lg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#5BE07E"/><stop offset="1" stop-color="#1FB84A"/></linearGradient>
      <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
      <radialGradient id="halo"><stop offset="0" stop-color="#30D158" stop-opacity=".55"/><stop offset="1" stop-color="#30D158" stop-opacity="0"/></radialGradient>
    </defs>
    <path id="glow" fill="none" stroke="#30D158" stroke-width="12" stroke-linecap="round" opacity=".35" filter="url(#soft)"/>
    <path id="path" fill="none" stroke="url(#lg)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle id="halo" r="34" fill="url(#halo)"/>
    <circle id="pulse" r="12" fill="none" stroke="#30D158" stroke-width="2.5"/>
    <circle id="dot" r="9" fill="#fff" stroke="#30D158" stroke-width="4.5"/>
  </svg>
</div>
<script>
// Scene line: a glass "Weekly sign-ups" widget: seven blue bars spring up in turn, a glowing line threads their tops,
// a dot rides it and "+200%" lands big in green. Every value is a function of t alone (6 s loop).
const { ease, seg, run, lerp, clamp } = Motion;
const N = 7, BW = 46, GAP = 14, X0 = 280 - (N * BW + (N - 1) * GAP) / 2, BASE = 430;
const STUB = [42, 36, 38, 46, 50, 56, 64], FULL = [74, 100, 86, 134, 150, 196, 244];
const bars = [...Array(N)].map((_, i) => { const b = document.createElement('div'); b.className = 'bar';
  b.style.left = `${X0 + i * (BW + GAP)}px`; document.getElementById('bars').appendChild(b); return b; });
const hero = document.querySelector('.hero'), path = document.getElementById('path'), glow = document.getElementById('glow'),
  dot = document.getElementById('dot'), halo = document.getElementById('halo'), pulse = document.getElementById('pulse');
// smooth line through the final bar tops (Catmull-Rom as cubic Béziers)
const P = FULL.map((h, i) => [X0 + i * (BW + GAP) + BW / 2, BASE - h + 3]);
let d = `M${P[0][0]},${P[0][1]}`;
for (let i = 0; i < N - 1; i++) {
  const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(N - 1, i + 2)], k = 1 / 6;
  d += ` C${p1[0] + (p2[0] - p0[0]) * k},${p1[1] + (p2[1] - p0[1]) * k} ${p2[0] - (p3[0] - p1[0]) * k},${p2[1] - (p3[1] - p1[1]) * k} ${p2[0]},${p2[1]}`;
}
path.setAttribute('d', d); glow.setAttribute('d', d);
const L = path.getTotalLength();
path.style.strokeDasharray = glow.style.strokeDasharray = `${L} ${L}`;

run((t) => {
  // bars spring up in turn, then sink back to stubs in reverse order for the loop
  bars.forEach((b, i) => {
    const up = ease.spring(seg(t, .25 + i * .11, 1.05 + i * .11), .7);
    const down = ease.inOut(seg(t, 5.22 + (N - 1 - i) * .04, 5.68 + (N - 1 - i) * .04));
    b.style.height = `${lerp(STUB[i], FULL[i], up * (1 - down))}px`;
  });
  // the line draws through the tops while a dot rides its tip, and retracts the same way at the end
  const draw = ease.inOut(seg(t, 1.3, 2.35)) * (1 - ease.inOut(seg(t, 4.95, 5.5)));
  path.style.strokeDashoffset = glow.style.strokeDashoffset = L * (1 - draw);
  const on = seg(t, 1.25, 1.4) * (1 - seg(t, 5.4, 5.55));
  const pt = path.getPointAtLength(Math.max(.01, L * draw));
  path.style.opacity = glow.style.opacity = on ? 1 : 0;
  dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y);
  const land = ease.spring(seg(t, 2.3, 2.75), .8);
  dot.setAttribute('r', 9 * on * (1 + .25 * Math.sin(Math.PI * seg(t, 2.3, 2.6))));
  dot.style.opacity = on;
  // a soft halo and a slow pulse ring live on the last point while the result holds
  const live = seg(t, 2.3, 2.6) * (1 - seg(t, 4.8, 5.0));
  halo.setAttribute('cx', pt.x); halo.setAttribute('cy', pt.y); halo.style.opacity = live; halo.setAttribute('r', 34 * (.6 + .4 * land));
  const ph = ((t - 2.35) / 1.25) % 1, pk = t > 2.35 && t < 4.85 ? ph : 0;
  pulse.setAttribute('cx', pt.x); pulse.setAttribute('cy', pt.y);
  pulse.setAttribute('r', 10 + 26 * ease.out(pk)); pulse.style.opacity = live * (1 - pk) * .8 * (pk > 0 ? 1 : 0);
  // "+200%" lands big: spring scale with a blur that clears, then leaves with blur + scale
  const inK = ease.spring(seg(t, 2.25, 2.95), .9), outK = ease.inOut(seg(t, 4.85, 5.3));
  hero.style.opacity = clamp(seg(t, 2.25, 2.45) * (1 - outK));
  hero.style.transform = `translateY(${(1 - inK) * 22 + outK * -8}px) scale(${lerp(.55, 1, inK) * (1 - .12 * outK)})`;
  const blur = 14 * (1 - seg(t, 2.25, 2.6)) + 14 * outK;
  hero.style.filter = `blur(${blur}px) drop-shadow(0 10px 18px rgba(48,209,88,.28))`;
});
</script></body></html>
