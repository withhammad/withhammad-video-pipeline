<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>16 Map → route</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../apple.css"><script src="../../motion.js"></script>
<style>
  .label { position: absolute; left: 26px; top: 26px; height: 104px; padding: 0 26px 0 22px; display: flex; align-items: center; gap: 12px; border-radius: 28px; transform-origin: 30% 50%; }
  .label .four { font-size: 92px; line-height: 1; font-weight: 800; letter-spacing: -.05em; color: var(--a-blue); margin-top: -4px; }
  .label .txt { font-size: 27px; line-height: 1.02; font-weight: 700; letter-spacing: -.03em; color: var(--a-ink); }
</style></head>
<body class="apple"><div class="stage">
  <div class="tint" style="--c:#0A84FF; left: 240px; top: 90px; opacity: .1"></div>
  <div class="glass label"><div class="four hero-num">4</div><div class="txt">new<br>stores</div></div>
</div>
<script>
// Scene line: a tilted light map of the UAE: pins bounce onto Abu Dhabi, Dubai, Sharjah and Ras Al Khaimah, a glowing
// route draws between them and "4 new stores" lands. Every value is a function of t alone (6 s loop).
// Outline: Natural Earth admin-0 (public domain, via datasets/geo-countries), mainland plus the larger Abu Dhabi
// islands, simplified (Ramer-Douglas-Peucker) to 163 points. [lon, lat, lon, lat, ...]
const UAE = [[56.279,25.627,56.34,25.605,56.37,25.526,56.383,24.978,56.329,24.973,56.308,24.895,56.171,24.824,56.099,24.731,56.032,24.754,55.965,24.854,55.978,24.886,56.029,24.861,55.978,24.972,55.897,24.969,55.799,24.886,55.818,24.643,55.76,24.559,55.775,24.426,55.811,24.389,55.756,24.23,55.933,24.221,55.998,24.081,55.807,24.007,55.647,24.025,55.457,23.963,55.531,23.875,55.538,23.77,55.226,23.121,55.191,22.995,55.187,22.704,55.12,22.623,52.558,22.939,51.579,24.102,51.594,24.385,51.634,24.227,51.673,24.278,51.701,24.222,51.759,24.291,51.779,24.262,51.809,24.001,51.929,23.965,51.953,23.991,52.156,23.967,52.341,24.008,52.575,24.152,52.6,24.21,52.681,24.141,52.947,24.138,53.006,24.166,53.067,24.122,53.146,24.121,53.165,24.17,53.254,24.099,53.446,24.12,53.59,24.047,53.879,24.065,54.123,24.145,54.323,24.271,54.383,24.255,54.427,24.292,54.486,24.388,54.486,24.447,54.54,24.433,54.513,24.474,54.574,24.447,54.571,24.473,54.417,24.535,54.452,24.557,54.465,24.535,54.486,24.57,54.537,24.498,54.582,24.508,54.636,24.598,54.616,24.621,54.671,24.666,54.643,24.749,54.707,24.804,54.754,24.792,54.76,24.831,55.082,25.017,55.282,25.261,55.318,25.225,55.301,25.194,55.329,25.201,55.304,25.283,55.363,25.324,55.365,25.359,55.473,25.413,55.551,25.579,55.548,25.529,55.626,25.536,55.76,25.68,55.842,25.714,55.96,25.824,55.952,25.772,55.966,25.834,56.031,25.901,56.041,25.934,56.008,25.907,56.077,26.061,56.163,26.074,56.183,26.015,56.14,25.823,56.172,25.765,56.141,25.733,56.145,25.671,56.206,25.618],[53.657,24.158,53.628,24.164,53.643,24.186,53.723,24.23,53.777,24.23,53.848,24.275,53.863,24.235,53.955,24.201,53.965,24.173,53.951,24.15,53.885,24.141,53.837,24.177,53.834,24.152,53.775,24.13],[54.191,24.227,54.113,24.272,54.102,24.298,54.115,24.319,54.137,24.327,54.188,24.277],[52.574,24.344,52.611,24.373,52.634,24.367,52.651,24.325,52.592,24.253,52.556,24.307],[53.323,24.263,53.276,24.289,53.266,24.274,53.187,24.276,53.191,24.3,53.242,24.298,53.33,24.336,53.367,24.319,53.362,24.351,53.417,24.413,53.447,24.38,53.44,24.341,53.346,24.298],[54.383,24.44,54.335,24.453,54.335,24.469,54.396,24.523,54.397,24.483,54.471,24.425],[54.266,24.295,54.222,24.284,54.183,24.315,54.185,24.337,54.232,24.358],[54.326,24.373,54.336,24.35,54.309,24.314,54.279,24.364,54.311,24.355,54.292,24.385]];
// store pins at real positions: Abu Dhabi (city island), Dubai (Marina), Sharjah, Ras Al Khaimah
const CITIES = [[54.40, 24.46], [55.17, 25.07], [55.42, 25.33], [55.98, 25.77]];
const { ease, seg, run, lerp, clamp, canvas } = Motion;
const stage = document.querySelector('.stage'), label = document.querySelector('.label');
const { ctx } = canvas(stage);
stage.insertBefore(ctx.canvas, label); // canvas under the label
const S = 110, LON0 = 53.98, LAT0 = 24.42, KX = Math.cos(24.4 * Math.PI / 180);
const PITCH = 42 * Math.PI / 180, D = 1100, CX = 284, CY = 280, T = 18;
let yaw = 0;
// world (lon, lat, z) → screen
function P(lon, lat, z = 0) {
  const X = (lon - LON0) * KX * S, Y = (lat - LAT0) * S;
  const x1 = X * Math.cos(yaw) - Y * Math.sin(yaw), y1 = X * Math.sin(yaw) + Y * Math.cos(yaw);
  const v = y1 * Math.cos(PITCH) + z * Math.sin(PITCH), depth = y1 * Math.sin(PITCH) - z * Math.cos(PITCH);
  const f = D / (D + depth);
  return [CX + x1 * f, CY - v * f, f];
}
// plane coords (x, y in world units) → screen, for the floor grid
function Q(X, Y, z) {
  const x1 = X * Math.cos(yaw) - Y * Math.sin(yaw), y1 = X * Math.sin(yaw) + Y * Math.cos(yaw);
  const v = y1 * Math.cos(PITCH) + z * Math.sin(PITCH), depth = y1 * Math.sin(PITCH) - z * Math.cos(PITCH);
  const f = D / (D + depth);
  return [CX + x1 * f, CY - v * f];
}
const path = (z, dy = 0) => {
  ctx.beginPath();
  UAE.forEach((r) => { for (let i = 0; i < r.length; i += 2) { const [x, y] = P(r[i], r[i + 1], z); i ? ctx.lineTo(x, y + dy) : ctx.moveTo(x, y + dy); } ctx.closePath(); });
};
// a circle lying on the map top (projected), radius in world units
const ring = (lon, lat, r, z = 0) => {
  ctx.beginPath();
  for (let i = 0; i <= 40; i++) { const a = i / 40 * Math.PI * 2; const [x, y] = P(lon + r * Math.cos(a) / (KX * S), lat + r * Math.sin(a) / S, z); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
};
// the route: lifted arcs between the cities, sampled once per frame into a screen polyline with lengths
function routePts() {
  const pts = [];
  for (let s = 0; s < CITIES.length - 1; s++) {
    const [a1, b1] = CITIES[s], [a2, b2] = CITIES[s + 1];
    const len = Math.hypot((a2 - a1) * KX, b2 - b1) * S;
    for (let i = s ? 1 : 0; i <= 40; i++) { const u = i / 40; pts.push(P(lerp(a1, a2, u), lerp(b1, b2, u), Math.min(.16 * len, 16) * Math.sin(Math.PI * u) + 1)); }
  }
  let acc = 0; const L = [0];
  for (let i = 1; i < pts.length; i++) { acc += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(acc); }
  return { pts, L, total: acc };
}
function strokePart(R, k0, k1) {
  const a = k0 * R.total, b = k1 * R.total; if (b - a < .5) return null;
  ctx.beginPath(); let started = false, head = null;
  for (let i = 0; i < R.pts.length; i++) {
    if (R.L[i] < a) continue;
    if (R.L[i] > b) { const j = i - 1; const u = (b - R.L[j]) / (R.L[i] - R.L[j]); head = [lerp(R.pts[j][0], R.pts[i][0], u), lerp(R.pts[j][1], R.pts[i][1], u)]; ctx.lineTo(...head); break; }
    if (!started) { ctx.moveTo(R.pts[i][0], R.pts[i][1]); started = true; } else ctx.lineTo(R.pts[i][0], R.pts[i][1]);
    head = R.pts[i];
  }
  return head;
}
const DROP = [.45, .75, 1.05, 1.35]; // pin landing starts
// the route reaches each city at these fractions of its length (by segment)
run((t) => {
  yaw = (-6 + 1.6 * Math.sin(2 * Math.PI * t / 6)) * Math.PI / 180;
  ctx.clearRect(0, 0, 560, 500);
  // floor grid, fading out from the centre
  ctx.lineWidth = 1;
  for (let g = -9; g <= 9; g++) for (const dir of [0, 1]) {
    for (let k = -9; k < 9; k++) {
      const a = dir ? Q(g * 46, k * 46, -T - 1) : Q(k * 46, g * 46, -T - 1), b = dir ? Q(g * 46, (k + 1) * 46, -T - 1) : Q((k + 1) * 46, g * 46, -T - 1);
      const mx = (a[0] + b[0]) / 2 - 280, my = (a[1] + b[1]) / 2 - 290;
      const al = .11 * clamp(1 - Math.hypot(mx / 330, my / 230));
      if (al <= .002) continue;
      ctx.strokeStyle = `rgba(40,60,100,${al})`; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    }
  }
  // soft contact shadow
  ctx.save(); ctx.filter = 'blur(14px)'; ctx.fillStyle = 'rgba(25,45,90,.26)'; path(-T, 16); ctx.fill(); ctx.restore();
  // extruded side wall: stacked slices, darker at the base
  for (let k = 0; k <= T; k++) { ctx.fillStyle = Motion.mix('#b7bfcc', '#e2e6ec', k / T); path(-T + k); ctx.fill(); }
  // top face
  const g0 = P(51.6, 26.1), g1 = P(56.4, 22.6);
  const grad = ctx.createLinearGradient(g0[0], g0[1], g1[0], g1[1]);
  grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#eef1f6');
  ctx.fillStyle = grad; path(0); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 1.5; ctx.stroke();
  // route timing: draws 1.75 → 3.0 s, retracts from its start 5.2 → 5.75 s
  const R = routePts();
  const k1 = ease.inOut(seg(t, 1.75, 3.0)), k0 = ease.inOut(seg(t, 5.2, 5.75));
  // segment fractions where each city is reached
  const cityK = [0]; { let acc = 0; const segL = []; for (let s = 0; s < 3; s++) segL.push(R.L[(s + 1) * 40] - R.L[s * 40]); segL.forEach((l) => { acc += l; cityK.push(acc / R.total); }); }
  // city markers and glows on the map top
  CITIES.forEach(([lon, lat], i) => {
    const reached = clamp((k1 - cityK[i]) * 12 + 1) * (1 - clamp((k0 - cityK[i]) * 12 + 1));
    const pinOn = ease.out(seg(t, DROP[i] + .3, DROP[i] + .5)) * (1 - seg(t, 5.25 + i * .12, 5.45 + i * .12));
    const [x, y] = P(lon, lat, 0);
    // a soft blue pool of light where the route has arrived
    if (reached > 0) {
      ctx.save(); ctx.translate(x, y); ctx.scale(1, Math.cos(PITCH) * 1.1);
      const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 34); rg.addColorStop(0, `rgba(10,132,255,${.35 * reached})`); rg.addColorStop(1, 'rgba(10,132,255,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    // faint target rings while the city is still empty
    const empty = 1 - pinOn;
    if (empty > .01) { ctx.strokeStyle = `rgba(10,132,255,${.55 * empty})`; ctx.lineWidth = 1.8; ring(lon, lat, 7); ctx.stroke(); ctx.fillStyle = `rgba(10,132,255,${.6 * empty})`; ring(lon, lat, 2.4); ctx.fill(); }
    // landing ripples
    for (let j = 0; j < 2; j++) {
      const q = seg(t, DROP[i] + .32 + j * .16, DROP[i] + 1.05 + j * .16);
      if (q > 0 && q < 1) { ctx.strokeStyle = `rgba(10,132,255,${.5 * (1 - q)})`; ctx.lineWidth = 2; ring(lon, lat, 6 + 30 * ease.out(q)); ctx.stroke(); }
    }
  });
  // the glowing route
  if (k1 - k0 > .001) {
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.filter = 'blur(6px)'; ctx.strokeStyle = 'rgba(10,132,255,.55)'; ctx.lineWidth = 12; strokePart(R, k0, k1); ctx.stroke();
    ctx.filter = 'none'; ctx.strokeStyle = '#0A84FF'; ctx.lineWidth = 4.5; const head = strokePart(R, k0, k1); ctx.stroke();
    ctx.strokeStyle = 'rgba(190,225,255,.9)'; ctx.lineWidth = 1.4; strokePart(R, k0, k1); ctx.stroke();
    if (head && k1 < .999 && k0 < .001) { const gl = ctx.createRadialGradient(head[0], head[1], 0, head[0], head[1], 18); gl.addColorStop(0, 'rgba(255,255,255,1)'); gl.addColorStop(.3, 'rgba(120,190,255,.8)'); gl.addColorStop(1, 'rgba(10,132,255,0)'); ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(head[0], head[1], 18, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  // pins: drop in with a spring, lift away at the reset (far pins first so near ones overlap them)
  const order = CITIES.map((c, i) => [P(c[0], c[1])[1], i]).sort((a, b) => a[0] - b[0]);
  order.forEach(([, i]) => {
    const [lon, lat] = CITIES[i]; const [x, y, f] = P(lon, lat, 0);
    const land = ease.spring(seg(t, DROP[i], DROP[i] + .75), .9);
    const lift = ease.inOut(seg(t, 5.2 + i * .1, 5.65 + i * .1));
    const on = clamp(seg(t, DROP[i], DROP[i] + .12)) * (1 - lift);
    if (on <= .001) return;
    const off = -150 * (1 - land) - 120 * lift, H = 44 * f, r = 13 * f;
    // ground shadow
    ctx.save(); ctx.translate(x, y); ctx.scale(1, .45);
    ctx.fillStyle = `rgba(10,40,100,${.28 * on * clamp(1 + off / 150)})`; ctx.beginPath(); ctx.arc(0, 0, 9 * f, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.globalAlpha = on; if (lift > .01) ctx.filter = `blur(${5 * lift}px)`;
    const hy = y - H + off;
    ctx.strokeStyle = '#6f8fb8'; ctx.lineWidth = 2.6 * f; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x, y + off); ctx.lineTo(x, hy); ctx.stroke();
    const hg = ctx.createRadialGradient(x - r * .35, hy - r * .4, r * .1, x, hy, r * 1.05);
    hg.addColorStop(0, '#9fd2ff'); hg.addColorStop(.45, '#2a8fff'); hg.addColorStop(1, '#0060d0');
    ctx.shadowColor = 'rgba(0,60,160,.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(x, hy, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.ellipse(x - r * .35, hy - r * .42, r * .32, r * .2, -.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
  // "4 new stores": a glass label springs in once the route is complete; melts away (blur + shrink) at the reset
  const lin = ease.spring(seg(t, 3.0, 3.7), .8), lout = ease.inOut(seg(t, 5.05, 5.5));
  const lk = clamp(seg(t, 3.0, 3.2)) * (1 - lout);
  label.style.opacity = lk;
  label.style.transform = `translateY(${-10 * (1 - lin)}px) scale(${lerp(.7, 1, lin) * lerp(1, .85, lout)})`;
  const lb = 10 * (1 - clamp(seg(t, 3.0, 3.35))) + 10 * lout;
  label.style.filter = lb > .05 ? `blur(${lb}px)` : '';
});
</script></body></html>
