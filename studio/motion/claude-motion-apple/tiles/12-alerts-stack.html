<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>12 Alerts → stack</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../apple.css"><script src="../../motion.js"></script>
<style>
  .phone { position: absolute; left: 80px; top: 14px; width: 400px; height: 720px; border-radius: 74px; background: #16161a;
    box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 30px 60px -20px rgba(0,0,0,.35), inset 0 0 0 2px #3a3a40, inset 0 0 0 4px #0c0c0e; }
  .screen { position: absolute; left: 10px; top: 10px; right: 10px; bottom: 10px; border-radius: 64px; overflow: hidden;
    background: radial-gradient(90% 60% at 30% 95%, rgba(255,255,255,.38) 0%, rgba(255,255,255,0) 60%),
      radial-gradient(70% 50% at 85% 10%, #5fb0ff 0%, rgba(95,176,255,0) 70%),
      linear-gradient(180deg, #1f6fe8 0%, #2a84f7 45%, #4aa2ff 100%); }
  .swirl { position: absolute; left: -60px; top: 300px; width: 440px; height: 440px; border-radius: 50%;
    background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.0) 0 26px, rgba(255,255,255,.07) 26px 30px); filter: blur(4px); }
  .island { position: absolute; left: 50%; top: 14px; width: 118px; height: 34px; margin-left: -59px; border-radius: 18px; background: #050506; }
  .date { position: absolute; left: 0; right: 0; top: 66px; text-align: center; color: rgba(255,255,255,.88); font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .time { position: absolute; left: 0; right: 0; top: 84px; text-align: center; color: #fff; font-size: 96px; font-weight: 700; letter-spacing: -.04em;
    text-shadow: 0 2px 18px rgba(0,40,120,.18); font-variant-numeric: tabular-nums; }
  .card { position: absolute; left: 16px; width: 348px; border-radius: 30px; transform-origin: 50% 100%;
    background: linear-gradient(180deg, #ffffff 0%, #f4f6fa 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 22px -6px rgba(0,30,90,.30), inset 0 1px 0 #fff; }
  .row { position: absolute; left: 16px; right: 20px; top: 0; height: 96px; display: flex; align-items: center; gap: 14px; }
  .row .t { font-size: 19px; font-weight: 600; color: var(--a-grey); letter-spacing: -.01em; flex: 1; }
  .row .amt { font-size: 34px; font-weight: 800; letter-spacing: -.04em; color: var(--a-ink); white-space: nowrap; }
  .sq { position: relative; width: 54px; height: 54px; flex: none; --c1: #5BE07E; --c2: #1FAE45; }
  .sq svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .badge { position: absolute; width: 42px; height: 42px; margin: -21px; border-radius: 21px; background: linear-gradient(180deg, #5BE07E, #22B84A);
    color: #fff; font-size: 21px; font-weight: 800; display: flex; align-items: center; justify-content: center; letter-spacing: -.03em;
    box-shadow: 0 0 0 3px #fff, 0 6px 12px -2px rgba(0,80,30,.4); font-variant-numeric: tabular-nums; z-index: 20; }
  .sum { position: absolute; left: 0; right: 0; top: 0; height: 250px; text-align: center; }
  .sum .sq { position: absolute; left: 18px; top: 18px; width: 42px; height: 42px; }
  .sum .big { position: absolute; left: 0; right: 0; top: 26px; font-size: 150px; line-height: 1; }
  .sum .sub { position: absolute; left: 0; right: 0; top: 182px; font-size: 26px; font-weight: 600; color: var(--a-grey); letter-spacing: -.02em; }
</style></head>
<body class="apple"><div class="stage">
  <div class="tint" style="--c:#0A84FF; left: 100px; top: 60px"></div>
  <div class="phone"><div class="screen">
    <div class="swirl"></div>
    <div class="island"></div>
    <div class="date">Tuesday 27 October</div>
    <div class="time">10:24</div>
    <div id="cards"></div>
    <div class="badge" id="badge">2</div>
  </div></div>
</div>
<script>
// Scene line: a lock screen at 10:24: "New order AED 42" and "New order AED 96" drop in with springs, stack into a pile
// and the badge counts up to "12 new orders". Every value is a function of t alone (6 s loop).
const { ease, seg, run, lerp, clamp } = Motion;
const BAG = '<svg viewBox="-1 -1 48 48"><path d="M14 18h18l-1.6 15.2a3 3 0 0 1-3 2.8h-8.8a3 3 0 0 1-3-2.8z" fill="#fff"/>' +
  '<path d="M18.5 19v-3.2a4.5 4.5 0 0 1 9 0V19" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>';
const ORDERS = [{ a: 'AED 42', at: .3 }, { a: 'AED 96', at: 1.1 }, { a: 'AED 28', at: 1.75 }, { a: 'AED 64', at: 2.3 }];
const box = document.getElementById('cards'), badge = document.getElementById('badge');
const cards = ORDERS.map((o, i) => {
  const c = document.createElement('div'); c.className = 'card'; c.style.zIndex = 10 + i;
  c.innerHTML = `<div class="row"><div class="squircle sq">${BAG}</div><div class="t">New order</div><div class="amt">${o.a}</div></div>` +
    (i === ORDERS.length - 1 ? `<div class="sum"><div class="squircle sq">${BAG}</div><div class="hero-num big">12</div><div class="sub">new orders</div></div>` : '');
  box.appendChild(c); return c;
});
const TOP = 222, ROW = 96, BIG = 250;
// badge count steps: 2 and 3 and 4 come with cards, 5 → 12 tick in quickly after
const COUNT = [[1.1, 2], [1.75, 3], [2.3, 4]];
for (let n = 5; n <= 12; n++) COUNT.push([2.6 + (n - 5) * .085, n]);
run((t) => {
  const morph = ease.spring(seg(t, 3.3, 3.95), .6);
  const h = lerp(ROW, BIG, morph);
  // reset: the whole pile is swiped up out of the screen (blur + shrink), back to the empty lock screen
  const out = ease.inOut(seg(t, 5.25, 5.92));
  const gy = -520 * out, gs = 1 - .12 * out, gb = 8 * Math.sin(Math.PI * out);
  cards.forEach((c, i) => {
    const o = ORDERS[i];
    const drop = ease.spring(seg(t, o.at, o.at + .65), .9);
    let depth = 0; // how many later cards sit on top of this one
    for (let j = i + 1; j < ORDERS.length; j++) depth += ease.spring(seg(t, ORDERS[j].at, ORDERS[j].at + .5), .4);
    const y = lerp(-150, TOP, drop) + Math.min(depth, 2.4) * 12;
    const s = 1 - Math.min(depth, 2.4) * .055;
    c.style.height = `${h}px`;
    c.style.top = '0px';
    c.style.transform = `translateY(${y + gy}px) scale(${s * gs})`;
    c.style.opacity = (depth > 2.4 ? clamp(3.4 - depth) : 1) * (t < o.at ? 0 : 1);
    c.style.filter = gb > .05 ? `blur(${gb}px)` : (drop < .5 ? `blur(${4 * (1 - drop * 2)}px)` : '');
    const row = c.querySelector('.row');
    row.style.opacity = clamp(1 - depth * 1.6) * (1 - clamp(seg(t, 3.3, 3.5)));
    row.style.filter = '';
    const sum = c.querySelector('.sum');
    if (sum) {
      const k = clamp(seg(t, 3.5, 3.85));
      sum.style.opacity = k;
      sum.style.transform = `scale(${lerp(.8, 1, ease.spring(seg(t, 3.5, 4.1), .8))})`;
      sum.style.filter = k < 1 ? `blur(${8 * (1 - k)}px)` : '';
    }
  });
  // badge sits on the front card's top-right corner and counts up, a small pop on each step
  let n = 0, last = -9;
  COUNT.forEach(([at, v]) => { if (t >= at) { n = v; last = at; } });
  const pop = 1 + .28 * Math.sin(Math.PI * seg(t, last, last + .16));
  const bIn = ease.spring(seg(t, 1.1, 1.5), .9), bOut = ease.inOut(seg(t, 3.25, 3.45));
  badge.textContent = n || 2;
  badge.style.left = '358px'; badge.style.top = `${TOP + 4}px`;
  badge.style.transform = `scale(${bIn * (1 - bOut) * pop})`;
  badge.style.opacity = clamp(bIn * 3) * (1 - bOut);
});
</script></body></html>
