<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>9 Agentic AI Concepts</title>
<link rel="stylesheet" href="../tokens.css"><script src="spec.js"></script>
<style>
  /* 1080x1350 LinkedIn image post: the reference's 3x3 board. Each card spotlights in turn for 1.6 s (14.4 s loop). */
  html, body { width: 1080px; height: 1350px; }
  body { position: relative; overflow: hidden; color: #0d1330;
    background:
      radial-gradient(60% 45% at 0% 0%, #ffe7d2 0%, transparent 70%),
      radial-gradient(55% 50% at 100% 8%, #dfe2ff 0%, transparent 70%),
      radial-gradient(70% 40% at 100% 100%, #ffd2b0 0%, transparent 70%),
      radial-gradient(60% 40% at 0% 100%, #ffe1c8 0%, transparent 70%),
      #f8f4fb; }
  .pill { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); height: 34px; padding: 0 22px;
    display: flex; align-items: center; gap: 10px; border-radius: 17px; background: rgba(255,255,255,.85);
    border: 1.5px solid #c9cdfb; font: 800 14px var(--font); letter-spacing: .26em; color: #3b44e0; white-space: nowrap; }
  .pill svg { width: 17px; height: 17px; color: #ff6a1f; }
  .title { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; letter-spacing: -.045em;
    line-height: 1; white-space: nowrap; color: #0d1330; }
  .t1 { top: 68px; font-size: 66px; }
  .t2 { top: 140px; font-size: 66px; }
  .nine { display: inline-grid; place-items: center; width: 70px; height: 70px; border-radius: 18px; margin-right: 16px;
    vertical-align: -9px; color: #fff; font-size: 52px; letter-spacing: 0;
    background: linear-gradient(145deg, #5b7cff, #2f45e8); transform: rotate(-7deg);
    box-shadow: 0 10px 22px -8px rgba(47,69,232,.6), inset 0 -4px 0 rgba(0,0,0,.12); }
  .grad { background: linear-gradient(90deg, #ff9a1f, #ff5a1f 70%); -webkit-background-clip: text; background-clip: text;
    color: transparent; padding-right: .03em; }
  .hl { background: linear-gradient(transparent 58%, #ffcc33 58%, #ffcc33 92%, transparent 92%); padding: 0 .06em; }
  .prog { position: absolute; top: 222px; left: 50%; transform: translateX(-50%); display: flex; gap: 7px; }
  .prog i { width: 24px; height: 6px; border-radius: 3px; background: #d9d7e6; display: block; }

  .card { position: absolute; width: 318px; height: 296px; border-radius: 22px; background: rgba(255,255,255,.92);
    border: 1.5px solid var(--soft); box-shadow: 0 10px 28px -14px rgba(40,30,90,.18); overflow: hidden; }
  .card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 90px; background: linear-gradient(180deg, var(--tint), rgba(255,255,255,0)); }
  .card .ring { position: absolute; inset: -1.5px; border-radius: 22px; border: 3px solid var(--c2); opacity: 0; pointer-events: none; }
  .ico { position: absolute; left: 16px; top: 18px; width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(145deg, var(--c1), var(--c2)); box-shadow: 0 8px 16px -8px var(--c2), inset 0 -3px 0 rgba(0,0,0,.12); }
  .ico svg { width: 27px; height: 27px; color: #fff; }
  .ct { position: absolute; left: 78px; top: 17px; font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
  .cs { position: absolute; left: 78px; top: 49px; font-size: 15px; font-weight: 500; color: #5b6078; letter-spacing: -.01em; white-space: nowrap; }
  .num { position: absolute; right: 14px; top: 18px; padding: 3px 7px; border-radius: 7px; border: 1.5px solid var(--soft);
    background: #fff; font: 500 14px var(--mono); color: var(--c2); }
  .div { position: absolute; left: 16px; right: 16px; top: 84px; border-top: 1.5px dashed var(--soft); }
  svg.wires { position: absolute; left: 0; top: 0; width: 318px; height: 300px; overflow: visible; }
  .node { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #fff; border: 1.5px solid var(--soft); border-radius: 11px; box-shadow: 0 4px 10px -6px rgba(40,30,90,.25);
    font-weight: 700; font-size: 15px; letter-spacing: -.02em; color: #141a35; white-space: nowrap; }
  .node .row { display: flex; align-items: center; gap: 6px; }
  .node svg { width: 16px; height: 16px; color: var(--c2); flex: none; }
  .node .sub { font-size: 10.5px; font-weight: 600; color: var(--c2); margin-top: 2px; letter-spacing: 0; }
  .node.strong { border-color: var(--mid); background: linear-gradient(180deg, #fff, var(--tint)); }
  .node.dashed { border-style: dashed; border-width: 2px; }
  .node.chip { border-radius: 9px; background: var(--tint); border-color: var(--mid); }
  .node.small { font-size: 12.5px; }
  .node.stack .row { flex-direction: column; gap: 4px; }
  .node.stack svg { width: 21px; height: 21px; }
  .node.small svg { width: 13px; height: 13px; }
  .tag { position: absolute; transform: translate(-50%, -50%); font-size: 12px; font-style: italic; font-weight: 700;
    color: var(--c2); white-space: nowrap; letter-spacing: -.01em; }
  .skill { position: absolute; border-radius: 10px; border: 1.5px solid var(--mid); background: #fff; overflow: hidden;
    box-shadow: 0 4px 10px -6px rgba(40,30,90,.25); }
  .skill .hd { height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 9px; color: #fff;
    font: 500 13px var(--mono); background: linear-gradient(90deg, var(--c1), var(--c2)); }
  .skill .hd svg { width: 14px; height: 14px; }
  .skill .ln { font: 500 11.5px var(--mono); color: #2b3150; height: 20px; line-height: 20px; padding: 0 9px; margin: 0 4px; border-radius: 5px; white-space: nowrap; }
  .skill .ln b { color: var(--c2); font-weight: 500; }

  .foot { position: absolute; left: 46px; right: 46px; top: 1168px; height: 92px; }
  .av { position: absolute; left: 0; top: 6px; width: 76px; height: 76px; border-radius: 50%; padding: 3px;
    background: linear-gradient(145deg, #ffb347, #ff5a1f); }
  .av img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; display: block; border: 3px solid #fff; }
  .nm { position: absolute; left: 92px; top: 14px; font-size: 27px; font-weight: 800; letter-spacing: -.03em; }
  .rl { position: absolute; left: 92px; top: 50px; font-size: 18px; font-weight: 500; color: #5b6078; }
  .cl { position: absolute; right: 0; top: 14px; font-size: 30px; font-weight: 900; letter-spacing: -.035em; }
  .cl span { color: #ff5a1f; }
  .cl2 { position: absolute; right: 0; top: 54px; font-size: 18px; font-weight: 500; color: #5b6078; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: #0b0d19; color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 22px; font-weight: 700; letter-spacing: -.015em; }
  .bar .brand { font-weight: 900; letter-spacing: .14em; font-size: 17px; color: #ff9a3c; padding: 5px 10px;
    border: 1.5px solid #ff9a3c; border-radius: 7px; margin-right: 6px; }
  .bar em { font-style: normal; color: #ffb054; }
  .bar svg { width: 24px; height: 24px; color: #ffb054; }
</style></head>
<body>
  <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" id="pillbot"></svg>AGENTIC AI · START HERE</div>
  <div class="title t1"><span class="nine">9</span><span class="grad">Agentic AI</span> Concepts</div>
  <div class="title t2">Every Builder <span class="hl">Should Know</span></div>
  <div class="prog"></div>
  <div id="cards"></div>
  <div class="foot">
    <div class="av"><img src="../claude-motion-graphics/assets/hammad.jpg" alt=""></div>
    <div class="nm">Hammad Yousuf</div>
    <div class="rl">AI Implementation Specialist</div>
    <div class="cl">Know the parts, <span>ship the agent</span></div>
    <div class="cl2">Save this before your next agent build</div>
  </div>
  <div class="bar"><span class="brand">WITHHAMMAD</span><span>The free guide to all 9, with examples</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" id="bararrow"></svg>
    <em>withhammad.com</em></div>
<script>
const LOOP = 14.4, SLOT = LOOP / 9, CYCLE = 4.8, DOT = 1.2;
const svgIcon = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
document.getElementById('pillbot').innerHTML = ICONS.bot;
document.getElementById('bararrow').innerHTML = ICONS.arrow;
const hexA = (h, a) => `rgba(${parseInt(h.slice(1, 3), 16)},${parseInt(h.slice(3, 5), 16)},${parseInt(h.slice(5, 7), 16)},${a})`;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };

const prog = document.querySelector('.prog');
const segs = CARDS.map(() => prog.appendChild(document.createElement('i')));
const host = document.getElementById('cards');
const NS = 'http://www.w3.org/2000/svg';
const cards = CARDS.map((c, i) => {
  const el = document.createElement('div'); el.className = 'card';
  el.style.left = (45 + (i % 3) * 336) + 'px'; el.style.top = (246 + Math.floor(i / 3) * 306) + 'px';
  el.style.setProperty('--c1', c.c1); el.style.setProperty('--c2', c.c2);
  el.style.setProperty('--tint', hexA(c.c2, .09)); el.style.setProperty('--soft', hexA(c.c2, .22)); el.style.setProperty('--mid', hexA(c.c2, .5));
  el.innerHTML = `<div class="ico">${svgIcon(c.icon)}</div><div class="ct">${c.title}</div><div class="cs">${c.sub}</div>
    <div class="num">${String(i + 1).padStart(2, '0')}</div><div class="div"></div><div class="ring"></div>`;
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'wires'); svg.setAttribute('viewBox', '0 0 318 300');
  svg.innerHTML = `<defs><marker id="ah${i}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="${c.c2}"/></marker></defs>`;
  el.appendChild(svg);
  const edges = c.edges.map((d, k) => {
    const plain = d.startsWith('!'); d = d.replace('!', '');
    const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none');
    p.setAttribute('stroke', hexA(c.c2, .75)); p.setAttribute('stroke-width', '1.8'); p.setAttribute('stroke-dasharray', '5 4');
    if (!plain) p.setAttribute('marker-end', `url(#ah${i})`);
    svg.appendChild(p);
    const len = p.getTotalLength();
    let dot = null;
    if (len > 14) { dot = document.createElementNS(NS, 'circle'); dot.setAttribute('r', '4.2'); dot.setAttribute('fill', c.c2);
      dot.setAttribute('stroke', '#fff'); dot.setAttribute('stroke-width', '1.5'); svg.appendChild(dot); }
    return { p, len, dot, phase: (k * 0.37) % 1 };
  });
  for (const [txt, x, y] of c.tags || []) {
    const t = document.createElement('div'); t.className = 'tag'; t.textContent = txt; t.style.left = x + 'px'; t.style.top = y + 'px'; el.appendChild(t);
  }
  const nodes = {};
  for (const [id, n] of Object.entries(c.nodes)) {
    const d = document.createElement('div');
    d.className = 'node' + (n.strong ? ' strong' : '') + (n.dashed ? ' dashed' : '') + (n.chip ? ' chip' : '') + (n.small ? ' small' : '') + (n.stack ? ' stack' : '');
    const [x, y, w, h] = n.r; Object.assign(d.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    d.innerHTML = `<div class="row">${svgIcon(n.icon)}<span>${n.label}</span></div>${n.sub ? `<div class="sub">${n.sub}</div>` : ''}`;
    el.appendChild(d); nodes[id] = d;
  }
  let lines = [];
  if (c.skill) {
    const s = document.createElement('div'); s.className = 'skill';
    const [x, y, w, h] = c.skill.r; Object.assign(s.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    s.innerHTML = `<div class="hd">${svgIcon('file')}SKILL.md</div>` + c.skill.lines.map((l) =>
      `<div class="ln">${l.replace(/^(\w+:)/, '<b>$1</b>')}</div>`).join('');
    el.appendChild(s); lines = [...s.querySelectorAll('.ln')];
  }
  host.appendChild(el);
  return { c, el, ring: el.querySelector('.ring'), edges, nodes, lines };
});

// focus: which card is spotlit (fractional values cross-fade); null = follow the board's own clock
function draw(t, focus) {
  t = ((t % LOOP) + LOOP) % LOOP;
  const f = focus ?? t / SLOT;
  cards.forEach((k, i) => {
    // spotlight: a smooth rise into the slot and out of it, wrapping at the loop seam
    let d = Math.abs(f - (i + .5)); d = Math.min(d, 9 - d);
    const on = smooth((0.62 - d) / 0.2);
    k.ring.style.opacity = on;
    k.el.style.boxShadow = `0 10px 28px -14px rgba(40,30,90,.18), 0 0 0 ${on * 6}px ${hexA(k.c.c2, .12 * on)}, 0 18px 40px -16px ${hexA(k.c.c2, .45 * on)}`;
    k.el.style.transform = `translateY(${-3 * on}px)`;
    segs[i].style.background = on > .5 ? k.c.c2 : '#d9d7e6';
    segs[i].style.width = (24 + 14 * on) + 'px';
    // the active node inside the card
    const n = k.c.cycle.length, ph = (t % CYCLE) / CYCLE * n, cur = Math.floor(ph), mix = smooth((ph - cur) / 0.18);
    k.c.cycle.forEach((id, j) => {
      const a = j === cur ? mix : (j === (cur + n - 1) % n ? 1 - mix : 0);
      if (typeof id === 'number') {
        const ln = k.lines[id]; ln.style.background = hexA(k.c.c2, .14 * a); ln.style.boxShadow = `inset 3px 0 0 ${hexA(k.c.c2, a)}`;
      } else {
        const nd = k.nodes[id];
        nd.style.boxShadow = `0 4px 10px -6px rgba(40,30,90,.25), 0 0 0 ${2.5 * a}px ${k.c.c2}, 0 6px 16px -4px ${hexA(k.c.c2, .45 * a)}`;
        nd.style.transform = `scale(${1 + .04 * a})`;
      }
    });
    // dots flow along every wire, dashes march
    for (const e of k.edges) {
      e.p.setAttribute('stroke-dashoffset', String(-(t / DOT) * 18));
      if (!e.dot) continue;
      const u = ((t / DOT + e.phase) % 1), pt = e.p.getPointAtLength(u * e.len);
      e.dot.setAttribute('cx', pt.x); e.dot.setAttribute('cy', pt.y);
      e.dot.setAttribute('opacity', String(smooth(u / .12) * smooth((1 - u) / .12)));
    }
  });
}
// a capture (or the reel page) drives the clock: the live preview stops at the first seek
let seeking = false;
window.__draw = (t, focus) => { seeking = true; draw(t, focus); };
window.__seek = (t) => { seeking = true; draw(t); };
window.__ready = document.fonts.ready;
document.fonts.ready.then(() => { const tick = (now) => { if (seeking) return; draw(now / 1000); requestAnimationFrame(tick); }; requestAnimationFrame(tick); });
draw(0);
</script></body></html>
