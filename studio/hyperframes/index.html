<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"line1","type":"string","label":"Line 1 (bold black sans)","default":"Reverse Engineer"},
    {"id":"line2","type":"string","label":"Line 2 (white italic serif on blue pill)","default":"Any Feature"},
    {"id":"badge1","type":"string","label":"Badge 1 (desktop icon)","default":"Desktop"},
    {"id":"badge2","type":"string","label":"Badge 2 (globe icon)","default":"Web"},
    {"id":"badge3","type":"string","label":"Badge 3 (phone icon)","default":"Android"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <title>title-insert</title>
    <!--
      title-insert: transparent 720x1280 @30fps, 5.0 s opening title for the Remotion "Reel".
      Rendered with: npx hyperframes render --format webm  (VP9 + alpha). See render.sh.
      Everything lives in the top 40% of the frame (y < 512); the presenter sits below.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("fonts/inter-latin-800-normal.woff2") format("woff2");
        font-weight: 800;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/inter-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("fonts/instrument-serif-latin-400-italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      /* Top 40% band (0..512 px). Nothing is drawn below it. */
      #title-insert-band {
        position: absolute;
        top: 0;
        left: 0;
        width: 720px;
        height: 512px;
      }
      #title-insert-stack {
        position: absolute;
        top: 0;
        left: 0;
        width: 720px;
        height: 512px;
        padding-top: 66px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Line 1: bold black sans */
      #title-insert-line1 {
        display: flex;
        white-space: nowrap;
        gap: 16px;
        font-family: "Inter", sans-serif;
        font-weight: 800;
        font-size: 58px;
        line-height: 1.12;
        letter-spacing: -0.035em;
        color: #0d0f14;
        text-shadow: 0 2px 14px rgba(255, 255, 255, 0.55);
      }
      .ti-word {
        display: inline-block;
      }

      /* Line 2: white italic serif on a blue pill */
      #title-insert-pill-fade {
        margin-top: 12px;
      }
      #title-insert-pill {
        position: relative;
        white-space: nowrap;
        display: flex;
        gap: 14px;
        padding: 2px 28px 10px;
        border-radius: 16px;
        overflow: hidden;
        background: #2f6bff;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          0 14px 30px rgba(47, 107, 255, 0.34),
          0 2px 6px rgba(16, 36, 110, 0.22);
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-weight: 400;
        font-size: 74px;
        line-height: 1.05;
        color: #ffffff;
      }
      .ti-pill-word {
        display: inline-block;
        position: relative;
        z-index: 1;
      }
      #title-insert-shine {
        position: absolute;
        top: -20%;
        left: 0;
        width: 34%;
        height: 140%;
        background: linear-gradient(
          100deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.38) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        z-index: 0;
      }

      /* App-style badges */
      #title-insert-badges {
        margin-top: 22px;
        display: flex;
        gap: 12px;
      }
      .ti-badge {
        position: relative;
        display: flex;
        align-items: center;
        gap: 9px;
        height: 46px;
        padding: 0 17px 0 13px;
        border-radius: 13px;
        background: #111a33;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          0 8px 18px rgba(10, 20, 50, 0.22);
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 21px;
        letter-spacing: -0.01em;
        color: #f3f6ff;
      }
      .ti-badge svg {
        display: block;
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ti-ring {
        position: absolute;
        top: -4px;
        left: -4px;
        right: -4px;
        bottom: -4px;
        border-radius: 16px;
        border: 2.5px solid #2f6bff;
        box-shadow: 0 0 16px rgba(47, 107, 255, 0.45);
      }
      #title-insert-badge-desktop .ti-icon {
        color: #8ab4ff;
      }
      #title-insert-badge-web .ti-icon {
        color: #5eead4;
      }
      #title-insert-badge-android .ti-icon {
        color: #a3e635;
      }
      .ti-icon {
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="title-insert"
      data-start="0"
      data-duration="5"
      data-fps="30"
      data-width="720"
      data-height="1280"
    >
      <div id="title-insert-band">
        <div id="title-insert-stack">
          <div id="title-insert-line1">
            <span class="ti-word" id="title-insert-w1">Reverse</span>
            <span class="ti-word" id="title-insert-w2">Engineer</span>
          </div>

          <div id="title-insert-pill-fade">
            <div id="title-insert-pill">
              <div id="title-insert-shine" data-layout-ignore></div>
              <span class="ti-pill-word" id="title-insert-p1">Any</span>
              <span class="ti-pill-word" id="title-insert-p2">Feature</span>
            </div>
          </div>

          <div id="title-insert-badges">
            <div class="ti-badge" id="title-insert-badge-desktop">
              <div class="ti-ring"></div>
              <span class="ti-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="2.5" y="3.5" width="19" height="13" rx="2" />
                  <path d="M8 20.5h8M12 16.5v4" />
                </svg>
              </span>
              <span class="ti-label" id="title-insert-label1">Desktop</span>
            </div>
            <div class="ti-badge" id="title-insert-badge-web">
              <div class="ti-ring"></div>
              <span class="ti-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="9" />
                  <ellipse cx="12" cy="12" rx="4" ry="9" />
                  <path d="M3 12h18" />
                </svg>
              </span>
              <span class="ti-label" id="title-insert-label2">Web</span>
            </div>
            <div class="ti-badge" id="title-insert-badge-android">
              <div class="ti-ring"></div>
              <span class="ti-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="6" y="2.5" width="12" height="19" rx="3" />
                  <path d="M10.5 18h3" />
                </svg>
              </span>
              <span class="ti-label" id="title-insert-label3">Android</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Text comes from the composition variables (defaults = this video's title), so the same
      // insert can be re-rendered per lesson:  render --variables '{"line1":"…","line2":"…"}'.
      // The timeline is built after fonts load (text is measured to fit) and registered last.
      const DEFAULTS = {
        line1: "Reverse Engineer",
        line2: "Any Feature",
        badge1: "Desktop",
        badge2: "Web",
        badge3: "Android",
      };
      const hf = window.__hyperframes;
      const V = Object.assign({}, DEFAULTS, (hf && hf.getVariables && hf.getVariables()) || {});

      const fillWords = (container, text, cls, idPrefix) => {
        container.querySelectorAll("." + cls).forEach((n) => n.remove());
        return String(text)
          .trim()
          .split(/\s+/)
          .map((w, i) => {
            const span = document.createElement("span");
            span.className = cls;
            span.id = idPrefix + (i + 1);
            span.textContent = w;
            container.appendChild(span);
            return span;
          });
      };
      // Shrink a single-line element until it fits maxWidth (keeps long titles inside the frame).
      const fitWidth = (el, maxWidth, minPx) => {
        let fs = parseFloat(getComputedStyle(el).fontSize);
        while (el.scrollWidth > maxWidth && fs > minPx) {
          fs -= 2;
          el.style.fontSize = fs + "px";
        }
      };

      const build = () => {
        const line1 = document.getElementById("title-insert-line1");
        const pill = document.getElementById("title-insert-pill");
        const words1 = fillWords(line1, V.line1, "ti-word", "title-insert-w");
        const words2 = fillWords(pill, V.line2, "ti-pill-word", "title-insert-p");
        ["badge1", "badge2", "badge3"].forEach((k, i) => {
          document.getElementById("title-insert-label" + (i + 1)).textContent = V[k];
        });
        fitWidth(line1, 660, 36);
        fitWidth(pill, 640, 40);

        // One paused, seekable timeline. All times in seconds; everything is gone by ~4.72 s.
        const tl = gsap.timeline({ paused: true });
        const badges = [
          "#title-insert-badge-desktop",
          "#title-insert-badge-web",
          "#title-insert-badge-android",
        ];
        const rings = badges.map((b) => b + " .ti-ring");
        // Rings start hidden (gsap.set outside the timeline); entry tweens use fromTo so frame 0 is clean.
        gsap.set(rings, { opacity: 0 });

        // 1) Line 1 slides + fades in, word by word.
        words1.forEach((w, i) => {
          tl.fromTo(
            w,
            { opacity: 0, y: 34, filter: "blur(10px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" },
            0.1 + i * (words1.length > 1 ? Math.min(0.08, 0.24 / (words1.length - 1)) : 0),
          );
        });

        // 2) Blue pill pops in with overshoot ~0.15 s after line 1 starts.
        tl.fromTo("#title-insert-pill-fade", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 0.28);
        tl.fromTo(
          "#title-insert-pill",
          { scale: 0.35, rotation: -4 },
          { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.2)" },
          0.28,
        );
        words2.forEach((w, i) => {
          tl.fromTo(
            w,
            { opacity: 0, yPercent: 70 },
            { opacity: 1, yPercent: 0, duration: 0.4, ease: "power3.out" },
            0.36 + i * 0.09,
          );
        });
        tl.fromTo("#title-insert-shine", { xPercent: -140 }, { xPercent: 360, duration: 0.75, ease: "power2.inOut" }, 1.05);

        // 3) Badges stagger in under the pill.
        badges.forEach((b, i) => {
          tl.fromTo(
            b,
            { opacity: 0, y: 18, scale: 0.7 },
            { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2.6)" },
            0.62 + i * 0.11,
          );
        });

        // Gentle drift during the hold so no frame is static.
        tl.fromTo("#title-insert-stack", { y: 0 }, { y: -6, duration: 3.0, ease: "sine.inOut" }, 1.1);

        // 4) Spotlight cycles badge 1 -> 2 -> 3 (one lit, others dimmed).
        const DIM = 0.42;
        const spot = (on, at) => {
          badges.forEach((b, i) => {
            const lit = i === on;
            tl.to(b, { opacity: lit ? 1 : DIM, scale: lit ? 1.07 : 1, duration: 0.22, ease: "power2.out" }, at);
            tl.to(rings[i], { opacity: lit ? 1 : 0, duration: 0.22, ease: "power2.out" }, at);
          });
        };
        spot(0, 1.4);
        spot(1, 2.2);
        spot(2, 3.0);
        // All back to full before the exit.
        badges.forEach((b, i) => {
          tl.to(b, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, 3.8);
          tl.to(rings[i], { opacity: 0, duration: 0.22, ease: "power2.out" }, 3.8);
        });

        // 5) Clean exit, finished by ~4.72 s (frame 142 onwards is fully transparent).
        [...badges].reverse().forEach((b, i) => {
          tl.to(b, { opacity: 0, y: -12, scale: 0.9, duration: 0.25, ease: "power2.in" }, 4.2 + i * 0.05);
        });
        tl.to("#title-insert-pill", { scale: 0.6, duration: 0.28, ease: "back.in(1.6)" }, 4.32);
        tl.to("#title-insert-pill-fade", { opacity: 0, duration: 0.28, ease: "power2.in" }, 4.32);
        const outStep = words1.length > 1 ? Math.min(0.06, 0.12 / (words1.length - 1)) : 0;
        words1.forEach((w, i) => {
          tl.to(w, { opacity: 0, y: -24, filter: "blur(6px)", duration: 0.26, ease: "power2.in" }, 4.4 + i * outStep);
        });

        window.__timelines["title-insert"] = tl;
      };

      document.fonts.ready.then(build);
    </script>
  </body>
</html>
